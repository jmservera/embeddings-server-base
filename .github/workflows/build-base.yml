name: Build Base Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to cache'
        default: 'intfloat/multilingual-e5-base'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:multilingual-e5-base
            ghcr.io/${{ github.repository }}:latest
          secrets: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
