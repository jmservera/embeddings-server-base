name: Build Base Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.openvino'
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to cache'
        default: 'intfloat/multilingual-e5-base'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: torch
            tag_suffix: ""
            backend: "torch"
            dockerfile: "Dockerfile"
          - variant: openvino
            tag_suffix: "-openvino"
            backend: "openvino"
            dockerfile: "Dockerfile.openvino"
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.variant }} variant
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            BACKEND=${{ matrix.backend }}
          tags: |
            ghcr.io/${{ github.repository }}:3.12-slim-multilingual-e5-base${{ matrix.tag_suffix }}
            ${{ matrix.variant == 'torch' && format('ghcr.io/{0}:latest', github.repository) || '' }}
          secrets: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
